name = "evtripreports-station-check"
main = "src/index.js"
compatibility_date = "2026-10-14"
workers_dev = true
# Keep variables added in the dashboard when this file is deployed.
keep_vars = true

# Mondays 14:17 UTC (7:17 am Pacific in summer, 6:17 am in winter).
# Cloudflare counts day-of-week from 1 = Sunday, so use the name.
[triggers]
crons = ["17 14 * * MON"]

[vars]
SITE_URL = "https://evtripreports.pages.dev"
ROUTES_WEEKLY = "la-to-las-vegas"
ROUTES_MONTHLY = ""
NOTIFY_FROM = "admin@evtripreports.com"
NOTIFY_TO = "admin@evtripreports.com"

[[d1_databases]]
binding = "DB"
database_name = "ev-trip-reports"
database_id = "6a6d8d78-d71c-4d01-bb88-ae2eb173e3c7"

# Secrets (set in the Cloudflare dashboard, never in this file):
#   NLR_API_KEY  DOE / NLR developer key
#   RUN_TOKEN    random string that guards /run and /latest
#   FASTMAIL_TOKEN  Fastmail API token (Email + Email submission) used to send the report
